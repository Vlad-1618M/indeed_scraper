# =============================================================================
#       *** Job Scraper - Docker Compose Configuration ***
# =============================================================================
# Boards: Indeed (cookies required), Dice, Glassdoor (no cookies)
#
# From project root:
#   docker-compose -f build/docker-compose.yml build
#   docker-compose -f build/docker-compose.yml run --rm scraper-auto
#   docker-compose -f build/docker-compose.yml run --rm scraper-interactive
#   docker-compose -f build/docker-compose.yml run --rm scraper-dice
#   docker-compose -f build/docker-compose.yml run --rm scraper-glassdoor
#   docker-compose -f build/docker-compose.yml up -d report-server   # http://localhost:8765
#
# Indeed requires cookies: mount indeed_cookies.pkl (see scraper-indeed services)
# Dice and Glassdoor run without cookies.
# =============================================================================

services:
  # ==================================================================================================
  # *** INDEED - Automated | requires cookies (mount indeed_cookies.pkl) ***
  # ==================================================================================================
  scraper-auto:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: job-scraper-indeed-auto
    volumes:
      - ../artifacts:/app/artifacts
      - ../.env:/app/.env:ro
      # ___ Mount cookies when using Indeed | copy docker-compose.override.example.yml → docker-compose.override.yml
    environment:
      - DISPLAY=:99
      - TZ=${TZ:-America/New_York}
      - PROXY_SERVER=${PROXY_SERVER:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
    command: >
      python src/main.py --auto --board indeed
      --query "DevOps Engineer" --location "Remote" --remote
      --days 7 --max 25
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    shm_size: '2gb'

  # ==================================================================================================
  # *** INDEED - Interactive | TTY for board selection, cookie setup prompts ***
  # ==================================================================================================
  scraper-interactive:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: job-scraper-interactive
    volumes:
      - ../artifacts:/app/artifacts
      - ../.env:/app/.env:ro
    environment:
      - DISPLAY=:99
      - TZ=${TZ:-America/New_York}
    stdin_open: true
    tty: true
    command: python src/main.py
    shm_size: '2gb'

  # ==================================================================================================
  # *** DICE - No cookies | auto mode ***
  # ==================================================================================================
  scraper-dice:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: job-scraper-dice
    volumes:
      - ../artifacts:/app/artifacts
      - ../.env:/app/.env:ro
    environment:
      - DISPLAY=:99
      - TZ=${TZ:-America/New_York}
    command: >
      python src/main.py --auto --board dice
      --query "DevOps Engineer" --location "Remote" --remote
      --days 7 --max 25
    shm_size: '2gb'

  # ==================================================================================================
  # *** GLASSDOOR - No cookies | auto mode ***
  # ==================================================================================================
  scraper-glassdoor:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: job-scraper-glassdoor
    volumes:
      - ../artifacts:/app/artifacts
      - ../.env:/app/.env:ro
    environment:
      - DISPLAY=:99
      - TZ=${TZ:-America/New_York}
    command: >
      python src/main.py --auto --board glassdoor
      --query "Software Engineer" --location "Remote" --remote
      --days 7 --max 25
    shm_size: '2gb'

  # ==================================================================================================
  # *** SCHEDULED - Multi-board, multi-query (cron) ***
  # ==================================================================================================
  scraper-scheduled:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: job-scraper-scheduled
    volumes:
      - ../artifacts:/app/artifacts
      - ../.env:/app/.env:ro
    environment:
      - DISPLAY=:99
      - TZ=${TZ:-America/New_York}
    command: >
      /bin/bash -c "
        echo '[*] Starting scheduled scrape at $(date)' &&
        python src/main.py --auto --board indeed --query 'DevOps Engineer' --location 'Remote' --remote --days 1 --max 20 &&
        sleep 30 &&
        python src/main.py --auto --board dice --query 'Site Reliability Engineer' --location 'Remote' --remote --days 1 --max 20 &&
        sleep 30 &&
        python src/main.py --auto --board glassdoor --query 'Platform Engineer' --location 'Remote' --remote --days 1 --max 20 &&
        echo '[+] Scheduled scrape completed at $(date)'
      "
    shm_size: '2gb'

  # ==================================================================================================
  # *** WITH PROXY - Indeed + residential proxy ***
  # ==================================================================================================
  scraper-proxy:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: job-scraper-proxy
    volumes:
      - ../artifacts:/app/artifacts
      - ../.env:/app/.env:ro
    environment:
      - DISPLAY=:99
      - TZ=${TZ:-America/New_York}
    command: >
      python src/main.py --auto --board indeed
      --proxy "${PROXY_SERVER:-}" --proxy-user "${PROXY_USER:-}" --proxy-pass "${PROXY_PASS:-}"
      --query "DevOps Engineer" --location "Remote" --remote --days 7 --max 25
    shm_size: '2gb'

  # ==================================================================================================
  # *** REPORT SERVER - FastAPI + static HTML (same as host --serve) ***
  # ==================================================================================================
  report-server:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: job-report-server
    ports:
      - "${REPORT_PORT:-8765}:8765"
    volumes:
      - ../artifacts:/app/artifacts
      - ../.env:/app/.env:ro
    environment:
      - REPORT_HOST=0.0.0.0
      - REPORT_PORT=8765
      - TZ=${TZ:-America/New_York}
    command: >
      python3 modules/generate_job_reports.py --serve --host 0.0.0.0 --port 8765
    restart: unless-stopped

# =============================================================================
#                             *** NETWORK ***
# =============================================================================
networks:
  default:
    name: job-scraper-network

# =============================================================================
#               *** VOLUMES | <-- optional persistent storage ***
# =============================================================================
volumes:
  artifacts:
    driver: local
